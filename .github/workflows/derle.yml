name: Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Native çekirdek testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IR çekirdeğini masaüstünde derle ve test et
        run: |
          SRC=android/app/src/main/cpp
          mkdir -p build_test
          for f in $SRC/IRremoteESP8266/*.cpp $SRC/ircore.cpp tests/host_test.cpp; do
            g++ -O1 -std=gnu++11 -DUNIT_TEST -D_IR_LOCALE_=en-AU -I$SRC/shim -I$SRC/IRremoteESP8266 -I$SRC -w \
              -c "$f" -o "build_test/$(basename "$f").o" &
          done
          wait
          g++ -o build_test/host_test build_test/*.o -pthread
          ./build_test/host_test

  android:
    name: Android uygulaması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Dosyaları adlandır
        run: |
          mkdir -p cikti
          cp android/app/build/outputs/apk/debug/app-debug.apk cikti/GunKumanda.apk
          cp android/tvhelper/build/outputs/apk/debug/tvhelper-debug.apk cikti/GunKumanda-TV-Yardimcisi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: cikti/*.apk

  firmware:
    name: ESP32 IR modülü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Kart paketi ve kütüphaneler
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "NimBLE-Arduino@1.4.3"
          arduino-cli lib install --git-url https://github.com/crankyoldgit/IRremoteESP8266.git
      - name: Derle (ESP32-C3 ve ESP32)
        run: |
          mkdir -p cikti
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --output-dir build_c3 firmware/gun-ir-modul
          cp build_c3/gun-ir-modul.ino.merged.bin cikti/gun-ir-modul-esp32c3.bin 2>/dev/null || cp build_c3/gun-ir-modul.ino.bin cikti/gun-ir-modul-esp32c3.bin
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build_32 firmware/gun-ir-modul
          cp build_32/gun-ir-modul.ino.merged.bin cikti/gun-ir-modul-esp32.bin 2>/dev/null || cp build_32/gun-ir-modul.ino.bin cikti/gun-ir-modul-esp32.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: cikti/*.bin

  yayinla:
    name: Sürüm yayınla
    needs: [test, android, firmware]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dosyalar
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Gün Kumanda 1.0.${{ github.run_number }}
          make_latest: true
          files: dosyalar/*
          body: |
            - **GunKumanda.apk** — telefon uygulaması
            - **GunKumanda-TV-Yardimcisi.apk** — Android TV imleç yardımcısı (isteğe bağlı)
            - **gun-ir-modul-*.bin** — ESP32 IR modülü yazılımı
